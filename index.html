async function openDashboard(pass,remember){
 const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(SALT),iterations:ITER,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
 const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(IV)},key,bytes(DATA));
 const doc=new TextDecoder('utf-8',{fatal:true}).decode(plain);
 if(remember){try{sessionStorage.setItem(SESSION_KEY,pass)}catch(e){}}
 document.open();document.write(doc);document.close();
}
document.getElementById('login').addEventListener('submit',async e=>{
 e.preventDefault();
 const button=document.getElementById('open'),error=document.getElementById('error');
 button.disabled=true;error.textContent='Dekrypterar…';
 try{
  const pass=document.getElementById('password').value;
  await openDashboard(pass,true);
 }catch(err){
  error.textContent='Fel lösenord eller skadat krypterat innehåll.';
  button.disabled=false;
 }
});
(async()=>{
 let saved=null;
 try{saved=sessionStorage.getItem(SESSION_KEY)}catch(e){}
 if(!saved)return;
 document.getElementById('error').textContent='Återöppnar dashboarden…';
 try{await openDashboard(saved,false)}
 catch(err){
  try{sessionStorage.removeItem(SESSION_KEY)}catch(e){}
  document.getElementById('error').textContent='Sessionen kunde inte återställas. Ange lösenordet igen.';
 }
})();
</script></body></html>
