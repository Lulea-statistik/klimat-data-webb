 e.preventDefault();
 const button=document.getElementById('open'),error=document.getElementById('error');

(async()=>{
 let saved=null;
 try{saved=sessionStorage.getItem(SESSION_KEY)}catch(e){}
 if(!saved)return;
 document.getElementById('error').textContent='Återöppnar dashboarden…';
 try{await openDashboard(saved,false)}
 catch(err){
  try{sessionStorage.removeItem(SESSION_KEY)}catch(e){}
  document.getElementById('error').textContent='Sessionen kunde inte återställas. Ange lösenordet igen.';
 }
})();
